<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>轨迹 · 自画像的回声</title>
  <style>
    :root{
      color-scheme:dark;
      --ink:rgba(255,249,241,.96);--soft:rgba(255,246,235,.72);--faint:rgba(255,246,235,.45);
      --line:rgba(255,246,235,.2);--accent:#9fd7ff;--accent-strong:#b7e5ff;
      --glass:rgba(160,198,235,.17);--glass-strong:rgba(237,247,255,.23);--shadow:0 24px 58px rgba(1,13,34,.35)
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#dcd7d4;color:var(--ink)}
    button,textarea,input{font:inherit}button{border:0;color:inherit;cursor:pointer}
    body{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 14% 10%,#f2d7c6 0,transparent 29%),radial-gradient(circle at 87% 77%,#b6d2d8 0,transparent 34%),linear-gradient(135deg,#eee9e5,#bcc7c8 52%,#60717a)}
    .stage{display:flex;justify-content:center;width:100%}
    .phone{width:min(390px,calc(100vw - 28px));aspect-ratio:390/844;padding:7px;border-radius:43px;background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(199,215,220,.44) 43%,rgba(53,66,73,.76));box-shadow:0 30px 70px rgba(14,27,36,.4),inset 0 0 0 1px rgba(255,255,255,.88),inset 0 0 26px rgba(255,255,255,.2);position:relative}
    .phone:after{content:"";position:absolute;inset:2px;border-radius:41px;border:1px solid rgba(255,255,255,.4);pointer-events:none}
    .screen{position:relative;height:100%;overflow:hidden;border-radius:36px;background:#092f6e;isolation:isolate;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),inset 0 0 45px rgba(255,255,255,.08)}
    .background-video{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;object-position:center;background:#092f6e;filter:saturate(1.06) contrast(1.03);transform:scale(1.04);z-index:-3}
    .backdrop,.backdrop:before,.backdrop:after{position:absolute;inset:0;content:"";z-index:-2}
    .backdrop{background:linear-gradient(180deg,rgba(9,22,46,.06),rgba(3,14,38,.24));animation:water 12s ease-in-out infinite alternate}
    .backdrop:before{inset:-14%;background:radial-gradient(circle at 32% 26%,rgba(152,218,255,.28),transparent 20%),radial-gradient(circle at 74% 69%,rgba(75,147,241,.24),transparent 24%);filter:blur(22px);animation:drift 17s ease-in-out infinite alternate}
    .backdrop:after{background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 32%,rgba(0,8,32,.22));z-index:-2}
    @keyframes water{to{filter:hue-rotate(9deg) saturate(1.08);transform:scale(1.04)}}
    @keyframes drift{to{transform:translate(4%, -2%) scale(1.08)}}
    .frost{display:none;position:absolute;inset:0;background:rgba(13,35,75,.2);backdrop-filter:blur(15px) saturate(.82);-webkit-backdrop-filter:blur(15px) saturate(.82);pointer-events:none;z-index:-1}
    .screen.archive-active .frost{display:block}.screen.archive-active .background-video{filter:blur(4px) saturate(.82) contrast(.98);transform:scale(1.08)}
    .content{position:relative;height:100%;padding:14px 16px 13px;display:flex;flex-direction:column}
    .status{height:25px;display:flex;align-items:flex-start;justify-content:space-between;padding:2px 2px 0;font:300 16px/1 Arial,sans-serif;letter-spacing:-.05em;text-shadow:0 1px 4px rgba(0,0,0,.3)}
    .status-right{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:0}.signal{display:inline-flex;align-items:flex-end;gap:2px;height:12px}.signal i{display:block;width:3px;border-radius:1px;background:currentColor}.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:7px}.signal i:nth-child(3){height:10px}.signal i:nth-child(4){height:13px}.wifi{font-size:12px}.battery{padding:2px 5px;border:1px solid currentColor;border-radius:4px;font-size:8px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.menu-button{width:40px;height:38px;background:transparent;display:flex;flex-direction:column;justify-content:center;gap:7px;padding-left:4px}.menu-button i{display:block;height:1.5px;background:rgba(255,255,255,.84);border-radius:2px;box-shadow:0 1px 4px rgba(0,0,0,.28)}.menu-button i:first-child{width:17px}.menu-button i:last-child{width:11px;opacity:.68}.mark{display:grid;place-items:center;width:31px;height:24px;opacity:.85}.mark svg{width:31px;height:24px}.top-action{width:40px;height:38px;background:transparent;color:rgba(255,255,255,.76);font-size:22px}
    .view{min-height:0;flex:1;display:flex;flex-direction:column;animation:appear .34s ease both}.is-hidden{display:none!important}@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    .hero{flex:1;display:flex;align-items:center;justify-content:center;padding:0 0 36px}.hero-inner{width:92%;max-width:340px;position:relative}.glass-source{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;pointer-events:none}.date-button{display:flex;align-items:flex-start;background:transparent;color:var(--ink);padding:12px 0;margin-bottom:12px;text-align:left;text-shadow:0 2px 8px rgba(0,0,0,.28);position:relative;z-index:1}.year{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;letter-spacing:.04em;margin:2px 8px 0 1px}.date{font:300 39px/.86 Arial,sans-serif;letter-spacing:-.06em}.date-meta{display:flex;flex-direction:column;gap:5px;margin:1px 0 0 10px;font:300 11px/1 Arial,sans-serif}.date-meta strong{font-size:14px;letter-spacing:.04em}.date-meta span:last-child{font-size:10px;color:rgba(255,255,255,.76)}
    .composer{border:1px solid rgba(255,255,255,.38);border-radius:22px;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.08) 42%,rgba(126,202,255,.15));box-shadow:inset 0 1px 0 rgba(255,255,255,.68),inset 0 -1px 0 rgba(255,255,255,.2),0 16px 34px rgba(3,24,60,.18);backdrop-filter:blur(19px) saturate(1.1);-webkit-backdrop-filter:blur(19px) saturate(1.1);padding:16px 17px 12px}.composer textarea{display:block;width:100%;min-height:86px;resize:none;outline:0;border:0;background:transparent;color:var(--ink);font:400 16px/1.55 "PingFang SC","Microsoft YaHei",sans-serif}.composer textarea::placeholder{color:rgba(255,255,255,.74)}.composer-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px}.tools{display:flex;align-items:center;gap:6px}.tool{width:29px;height:29px;border-radius:10px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.74);font-size:12px;border:1px solid rgba(255,255,255,.12);transition:.2s}.tool:hover,.tool.is-selected{background:rgba(159,215,255,.28);color:#fff;transform:translateY(-1px)}.respond{min-height:32px;padding:0 13px;border-radius:999px;background:rgba(62,142,228,.72);border:1px solid rgba(255,255,255,.34);font-size:11px;box-shadow:0 6px 14px rgba(0,0,0,.14)}.respond:hover{background:rgba(89,165,241,.92)}.hint{margin:10px 0 0;color:rgba(255,255,255,.55);font-size:10px;line-height:1.45}.mode-row{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}.mode{padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);font-size:9px;color:rgba(255,255,255,.62)}.mode.is-selected{background:rgba(168,222,255,.24);color:#fff;border-color:rgba(198,235,255,.32)}
    .response{margin-top:13px;padding:13px 14px;border-radius:17px;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.24);box-shadow:0 14px 28px rgba(0,0,0,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:appear .3s ease both}.response-label{display:flex;align-items:center;gap:7px;color:var(--accent-strong);font-size:10px;letter-spacing:.08em;margin-bottom:8px}.pulse{width:7px;height:7px;border-radius:50%;background:var(--accent-strong);box-shadow:0 0 0 5px rgba(159,215,255,.14)}.response p{margin:0 0 11px;font:400 13px/1.6 "Noto Serif SC","STSong",serif;color:rgba(255,249,241,.94)}.response-actions{display:flex;gap:12px;align-items:center}.secondary,.text-button{font-size:10px}.secondary{padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.24)}.text-button{padding:3px 0;background:transparent;color:rgba(255,255,255,.7)}
    .bottom-nav{height:49px;display:flex;align-items:center;justify-content:space-around;margin-top:auto;color:rgba(255,255,255,.45);font-family:"Noto Serif SC","STSong",serif;font-size:17px}.nav-button{width:50%;height:43px;background:transparent;color:inherit;position:relative}.nav-button.is-active{color:rgba(255,255,255,.96)}.nav-button.is-active:after{content:"";position:absolute;left:50%;bottom:1px;width:22px;height:1px;transform:translateX(-50%);background:rgba(255,255,255,.72)}
    .archive-header{padding:13px 6px 0}.archive-tabs{display:flex;align-items:baseline;gap:29px}.archive-tab{padding:6px 0;background:transparent;color:var(--faint);font-size:22px;letter-spacing:-.04em}.archive-tab:last-child{font-family:"Noto Serif SC","STSong",serif;font-size:24px;letter-spacing:.02em}.archive-tab.is-active{color:var(--ink);text-shadow:0 0 16px rgba(255,255,255,.3)}.archive-tab.is-active:after{content:"";display:block;height:1px;width:48px;margin:8px auto 0;background:rgba(255,247,235,.72)}.tag-heading{margin:13px 0 0;font-size:14px;color:var(--soft)}.archive-scroll{position:relative;flex:1;min-height:0;overflow:auto;padding:13px 4px 8px 9px;scrollbar-width:none}.archive-scroll::-webkit-scrollbar{display:none}.rail{position:absolute;left:14px;top:39px;bottom:18px;width:1px;background:linear-gradient(180deg,rgba(255,245,233,.38),rgba(255,245,233,.08))}.year-heading,.day-heading{margin:5px 0 13px 20px;color:var(--faint);font-size:10px;letter-spacing:.1em}.day-heading{font-size:12px;letter-spacing:.06em;color:var(--soft);margin-top:14px;margin-bottom:12px}.entry{position:relative;padding:0 0 13px 20px;margin:0 0 6px}.entry:before{content:"";position:absolute;left:10px;top:5px;width:7px;height:7px;border-radius:50%;background:rgba(255,246,232,.86);box-shadow:0 0 0 3px rgba(255,246,232,.09),0 0 13px rgba(255,246,232,.2)}.time{font-size:10px;color:var(--faint);margin-bottom:6px;font-variant-numeric:tabular-nums}.note{position:relative;padding:12px 13px 11px;border-radius:17px;background:linear-gradient(145deg,rgba(255,255,255,.17),rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(0,0,0,.1),0 10px 23px rgba(0,0,0,.13);border:1px solid rgba(255,255,255,.08);cursor:pointer}.note.parked{background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.04))}.note:before{content:"";position:absolute;left:13px;right:13px;top:1px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);opacity:.65}.excerpt{margin:0 23px 7px 0;font-size:11px;line-height:1.5;color:rgba(255,249,241,.9)}.settle{margin:0 21px 8px 0;font:400 12px/1.45 "Noto Serif SC","STSong",serif;color:rgba(255,249,241,.96)}.settle:before{content:"“";color:rgba(255,245,230,.55);margin-right:2px}.settle:after{content:"”";color:rgba(255,245,230,.55);margin-left:2px}.note-foot{display:flex;justify-content:space-between;gap:8px;color:var(--faint);font-size:9px}.more{position:absolute;right:8px;top:8px;width:24px;height:25px;padding:0;background:transparent;color:rgba(255,249,241,.66);display:grid;place-items:center}.more span,.more span:before,.more span:after{content:"";display:block;width:3px;height:3px;border-radius:50%;background:currentColor}.more span:before{transform:translateY(-6px)}.more span:after{transform:translateY(3px)}.empty{padding:58px 22px;text-align:center;color:var(--faint);font-size:11px;line-height:1.7}.empty-orbit{font-size:30px;margin-bottom:7px}.archive-filter{display:flex;gap:6px;margin:10px 0 0 20px}.filter{padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:9px;color:var(--soft)}
    .floating-menu{position:absolute;right:12px;z-index:8;display:none;min-width:116px;padding:6px;border-radius:13px;background:rgba(18,31,52,.88);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(18px);box-shadow:0 12px 28px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.15)}.floating-menu.is-open{display:block;animation:appear .15s ease both}.floating-menu button{display:block;width:100%;padding:8px 9px;border-radius:8px;text-align:left;background:transparent;color:rgba(255,249,241,.9);font-size:10px}.floating-menu button:hover{background:rgba(255,255,255,.1)}
    .modal{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;background:rgba(4,16,34,.36);animation:fade .2s ease both}.settings{width:100%;padding:10px 20px 22px;border-radius:25px 25px 0 0;background:rgba(228,242,251,.92);color:#203443;border:1px solid rgba(255,255,255,.75);box-shadow:0 -18px 50px rgba(0,0,0,.24);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}@keyframes fade{from{opacity:0}to{opacity:1}}.handle{width:38px;height:4px;margin:0 auto 17px;border-radius:99px;background:rgba(32,52,67,.2)}.settings-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}.settings-head p{margin:0 0 3px;font-size:10px;letter-spacing:.12em;color:#66808f}.settings-head h2{margin:0;font:500 26px/1.2 Georgia,serif}.close{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.6);font-size:20px;color:#4d6470}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid rgba(32,52,67,.12)}.setting-row strong{display:block;margin-bottom:3px;font-size:12px}.setting-row small{display:block;color:#6c808a;font-size:9px;line-height:1.4}.segmented{display:flex;padding:3px;border-radius:10px;background:rgba(32,52,67,.09)}.segmented button{padding:6px 8px;border-radius:8px;background:transparent;color:#6c808a;font-size:9px}.segmented button.is-active{background:#fff;color:#203443;box-shadow:0 2px 8px rgba(32,52,67,.1)}.swatches{display:flex;gap:7px}.swatch{width:23px;height:23px;border-radius:50%;border:2px solid transparent}.swatch.is-active{outline:2px solid #356d69;outline-offset:2px}.swatch.mist{background:#b8d5d2}.swatch.sand{background:#d9c5a7}.swatch.dusk{background:#abb8d3}.switch input{display:none}.switch span{position:relative;display:block;width:39px;height:23px;border-radius:99px;background:rgba(32,52,67,.18);transition:.2s}.switch span:after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.14);transition:.2s}.switch input:checked+span{background:#397b78}.switch input:checked+span:after{transform:translateX(16px)}.privacy{display:flex;gap:8px;align-items:flex-start;margin:13px 0;padding:10px 11px;border-radius:12px;background:rgba(163,210,204,.38);color:#39716d}.privacy b{font-size:17px;line-height:1}.privacy p{margin:0;font-size:9px;line-height:1.5}.done{width:100%;min-height:36px;border-radius:12px;background:#2e716e;color:#fff;font-size:11px;box-shadow:0 7px 15px rgba(46,113,110,.2)}
    .toast{position:absolute;left:50%;bottom:59px;z-index:30;transform:translate(-50%,8px);opacity:0;pointer-events:none;white-space:nowrap;padding:8px 11px;border-radius:999px;background:rgba(10,24,44,.82);color:rgba(255,255,255,.92);font-size:10px;transition:.25s;box-shadow:0 8px 20px rgba(0,0,0,.2)}.toast.show{opacity:1;transform:translate(-50%,0)}
    body[data-hand="left"] .composer-toolbar{flex-direction:row-reverse}body[data-hand="left"] .tools{flex-direction:row-reverse}
    @media (max-width:420px){body{padding:10px;background:#e9e5e1}.phone{width:100%;max-width:390px}}
    @media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="stage">
    <section class="phone" aria-label="轨迹应用">
      <div class="screen">
        <video class="background-video" src="trajectory-bg.mp4" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video><div class="backdrop"></div><div class="frost"></div>
        <div class="content">
          <div class="status"><span>12:30</span><span class="status-right"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi">◔</span><span class="battery">70</span></span></div>
          <div class="topbar"><button class="menu-button" id="settingsButton" aria-label="打开设置"><i></i><i></i></button><div class="mark" aria-label="轨迹"><svg viewBox="0 0 44 30" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 15c6-11 14-11 20 0s14 11 18 0" stroke="rgba(255,255,255,.86)" stroke-width="1.4" stroke-linecap="round"/><path d="M3 20c6-7 13-7 20 0s14 7 18 0" stroke="rgba(181,229,255,.7)" stroke-width="1" stroke-linecap="round"/><circle cx="23" cy="15" r="2.5" fill="rgba(255,255,255,.95)"/></svg></div><button class="top-action" id="quietButton" aria-label="今天先不提醒">☾</button></div>

          <section class="view" id="nowView" aria-label="此刻">
            <div class="hero">
              <div class="hero-inner">
                <video class="glass-source" src="trajectory-bg.mp4" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video><button class="date-button" id="dateButton" aria-label="打开留存"><span class="year">2026</span><span class="date">08/29</span><span class="date-meta"><strong>SAT</strong><span id="liveTime">15:24</span></span></button>
                <section class="composer" aria-label="记录此刻"><label class="sr-only" for="thoughtInput">写下此刻的想法</label><textarea id="thoughtInput" placeholder="此刻发生了什么？"></textarea><div class="composer-toolbar"><div class="tools"><button class="tool" data-input="text" aria-label="文字输入">T</button><button class="tool" data-input="voice" aria-label="语音输入">◉</button><button class="tool" data-input="image" aria-label="添加图片">▧</button><button class="tool" data-input="video" aria-label="添加视频">▷</button><button class="tool" id="tagButton" aria-label="添加标签">＋</button></div><button class="respond" id="respondButton">听见我</button></div><p class="hint" id="composerHint">默认只回应，不催促。你也可以先记录，不回应。</p></section>
                <div class="mode-row" aria-label="回应模式"><button class="mode is-selected" data-mode="reflect">只听我说</button><button class="mode" data-mode="break_down">帮我拆一步</button><button class="mode" data-mode="recall">帮我回看过去</button></div>
                <section class="response is-hidden" id="responseCard" aria-live="polite"><div class="response-label"><span class="pulse"></span>一声回声</div><p id="responseText"></p><div class="response-actions"><button class="secondary" id="saveButton">留下这声回声</button><button class="text-button" id="quietResponseButton">先安静一会儿</button></div></section>
              </div>
            </div>
          </section>

          <section class="view is-hidden" id="archiveView" aria-label="留存">
            <header class="archive-header"><div class="archive-tabs" role="tablist" aria-label="留存视图"><button class="archive-tab is-active" data-archive-mode="date" role="tab" aria-selected="true">8/29</button><button class="archive-tab" data-archive-mode="tag" role="tab" aria-selected="false">标签</button></div><div class="tag-heading is-hidden" id="tagHeading">#找工作</div><div class="archive-filter"><button class="filter" id="dateFilter">最近 30 天⌄</button><button class="filter" id="tagFilter">所有标签⌄</button></div></header>
            <main class="archive-scroll" id="archiveScroll" aria-label="按时间排列的笔记"><div class="rail" aria-hidden="true"></div><div id="archiveList"></div></main>
          </section>
          <nav class="bottom-nav" aria-label="底部导航"><button class="nav-button is-active" data-view="now">此刻</button><button class="nav-button" data-view="archive">留存</button></nav>
        </div>
        <div class="floating-menu" id="floatingMenu" role="menu"><button data-action="edit">编辑</button><button data-action="tag">添加标签</button><button data-action="delete">删除</button></div>
        <div class="toast" id="toast" role="status"></div>
        <div class="modal is-hidden" id="settingsModal" role="presentation"><section class="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="handle"></div><div class="settings-head"><div><p>偏好与安全</p><h2 id="settingsTitle">设置</h2></div><button class="close" id="closeSettings" aria-label="关闭设置">×</button></div><div class="setting-row"><div><strong>常用手</strong><small>让常用按钮更靠近顺手的一侧</small></div><div class="segmented"><button data-hand-choice="left">左手</button><button data-hand-choice="right" class="is-active">右手</button></div></div><div class="setting-row"><div><strong>界面背景</strong><small>低饱和色块，保持阅读舒适</small></div><div class="swatches"><button class="swatch mist is-active" data-theme-choice="mist" aria-label="雾青"></button><button class="swatch sand" data-theme-choice="sand" aria-label="暖沙"></button><button class="swatch dusk" data-theme-choice="dusk" aria-label="暮蓝"></button></div></div><div class="setting-row"><div><strong>主动提醒</strong><small>默认关闭，只在你主动设置后提醒</small></div><label class="switch"><input type="checkbox" id="reminderToggle"><span></span></label></div><div class="setting-row"><div><strong>允许回看过去</strong><small>让 AI 在你请求时引用旧的回声</small></div><label class="switch"><input type="checkbox" id="historyToggle"><span></span></label></div><div class="privacy"><b>⌁</b><p>你的记录默认私密。云同步、AI 分析和媒体理解都可以分别控制。</p></div><button class="done" id="doneSettings">完成</button></section></div>
      </div>
    </section>
  </main>
  <script>
    (()=>{
      const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
      const seed=[
        {id:'seed-1',date:'2026-08-29',time:'15:24',text:'下午突然很焦虑，脑子里一直在想找工作的事。',settle:'今天先不解决找工作的全部问题，先给朋友发一条消息。',tags:['#找工作'],status:'暂时安放'},
        {id:'seed-2',date:'2026-08-29',time:'11:08',text:'感觉很累，什么都不想做。',settle:'先喝一杯水，再走到阳台站一会儿。',tags:['完成 · 喝水'],status:'已找到落点'},
        {id:'seed-3',date:'2026-08-29',time:'08:16',text:'醒来以后不太想面对今天。',settle:'我不用一开始就准备好，先坐起来就好。',tags:['#起床','#自我对话'],status:'已找到落点'},
        {id:'seed-4',date:'2026-08-28',time:'22:41',text:'今天有一点喘不过气，但我没有继续逼自己。',settle:'先让今晚只是今晚，明天再接住明天。',tags:['#自我照顾'],status:'暂时安放'}
      ];
      const state={view:'now',archiveMode:'date',mode:'reflect',records:JSON.parse(localStorage.getItem('trajectory_she_nicest_records')||'null')||seed,theme:localStorage.getItem('trajectory_she_nicest_theme')||'mist',hand:localStorage.getItem('trajectory_she_nicest_hand')||'right',reminders:localStorage.getItem('trajectory_she_nicest_reminders')==='true',history:localStorage.getItem('trajectory_she_nicest_history')==='true',menuRecord:null};
      const persist=()=>{localStorage.setItem('trajectory_she_nicest_records',JSON.stringify(state.records));localStorage.setItem('trajectory_she_nicest_theme',state.theme);localStorage.setItem('trajectory_she_nicest_hand',state.hand);localStorage.setItem('trajectory_she_nicest_reminders',String(state.reminders));localStorage.setItem('trajectory_she_nicest_history',String(state.history))};
      const toast=(message)=>{const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2200)};
      const escapeHtml=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const responseFor=(text,mode)=>{const t=text.trim();if(!t)return'你还没有准备好说很多，也没关系。可以先留下一个词，或者只是停在这里。';if(mode==='break_down')return`我听见你被“${t.slice(0,28)}${t.length>28?'…':''}”卡住了。今天只做一个 3 分钟动作：把相关页面打开，不要求完成。`;if(mode==='recall')return state.history&&state.records.length?`这件事曾在 ${state.records[0].date.replaceAll('-','.')} 回到你面前。那时的你留下了自己的声音；现在的你不必复制当时的答案，只要听听它。`:'你还没有允许我调用过去的回声。可以在设置里打开，也可以只陪你停在此刻。';return`我听见了：${t.slice(0,52)}${t.length>52?'…':''}。你不需要现在解决它。可以先把这句话留在这里，等未来的你有力气时再回来。`};
      const settleFor=(text,mode)=>mode==='break_down'?'先打开相关页面，只做一个 3 分钟动作。':mode==='recall'?'你曾经接住过自己，这一次也可以慢一点。':'今天先不解决全部问题，先给自己留一个可以呼吸的位置。';
      function setView(view){state.view=view;$('#nowView').classList.toggle('is-hidden',view!=='now');$('#archiveView').classList.toggle('is-hidden',view!=='archive');$('.screen').classList.toggle('archive-active',view==='archive');$$('.nav-button').forEach(b=>b.classList.toggle('is-active',b.dataset.view===view));if(view==='archive')renderArchive();closeMenu()}
      function renderArchive(){const list=$('#archiveList'),tagMode=state.archiveMode==='tag';$('#tagHeading').classList.toggle('is-hidden',!tagMode);$$('.archive-tab').forEach(b=>{const active=b.dataset.archiveMode===state.archiveMode;b.classList.toggle('is-active',active);b.setAttribute('aria-selected',String(active))});let records=tagMode?state.records.filter(r=>(r.tags||[]).some(t=>t.includes('找工作'))):state.records;if(!records.length){list.innerHTML='<div class="empty"><div class="empty-orbit">◌</div>这一天还没有留下什么。<br>你写下的，会在这里等你。</div>';return}const groups={};records.forEach(r=>(groups[r.date]??=[]).push(r));list.innerHTML=Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).map(([date,items],index)=>`<div class="year-heading">${date.slice(0,4)}年</div><div class="day-heading">${date.slice(5,7)}月${date.slice(8,10)}日</div>${items.map(r=>`<article class="entry"><div class="time">${escapeHtml(r.time)}</div><div class="note ${r.status==='暂时安放'?'parked':''}" data-record-id="${escapeHtml(r.id)}"><button class="more" data-more="${escapeHtml(r.id)}" aria-label="打开笔记菜单"><span></span></button><p class="excerpt">${escapeHtml(r.text)}</p><p class="settle">${escapeHtml(r.settle)}</p><div class="note-foot"><span>${(r.tags||[]).map(escapeHtml).join(' ')}</span><span>${escapeHtml(r.status||'已留下')}</span></div></div></article>`).join('')}`).join('');$$('[data-more]').forEach(btn=>btn.addEventListener('click',event=>{event.stopPropagation();openMenu(btn.dataset.more,btn)}));$$('.note').forEach(note=>note.addEventListener('click',()=>closeMenu()))}
      function openMenu(id,button){state.menuRecord=id;const menu=$('#floatingMenu'),screen=$('.screen').getBoundingClientRect(),rect=button.getBoundingClientRect();menu.style.top=`${Math.min(rect.bottom-screen.top+4,screen.height-145)}px`;menu.style.right='12px';menu.classList.add('is-open')}
      function closeMenu(){state.menuRecord=null;$('#floatingMenu').classList.remove('is-open')}
      function setTheme(theme){state.theme=theme;document.body.dataset.theme=theme;$$('[data-theme-choice]').forEach(b=>b.classList.toggle('is-active',b.dataset.themeChoice===theme));const colors={mist:['#092f6e','#2679ca'],sand:['#4e3d38','#a46b54'],dusk:['#151e56','#4d65b7']};document.querySelector('.screen').style.background=colors[theme][0];persist()}
      function setHand(hand){state.hand=hand;document.body.dataset.hand=hand;$$('[data-hand-choice]').forEach(b=>b.classList.toggle('is-active',b.dataset.handChoice===hand));persist()}
      function openSettings(){$('#settingsModal').classList.remove('is-hidden');$('#reminderToggle').checked=state.reminders;$('#historyToggle').checked=state.history}
      function closeSettings(){$('#settingsModal').classList.add('is-hidden')}
      $$('.nav-button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
      $('#dateButton').addEventListener('click',()=>setView('archive'));
      $('#respondButton').addEventListener('click',()=>{const text=$('#thoughtInput').value;$('#responseText').textContent=responseFor(text,state.mode);$('#responseCard').classList.remove('is-hidden');$('#saveButton').dataset.text=text.trim();if(!text.trim())toast('先写下一句话或几个词')});
      $('#saveButton').addEventListener('click',()=>{const text=$('#saveButton').dataset.text||$('#thoughtInput').value.trim();if(!text){toast('还没有可以留下的内容');return}const now=new Date(),iso=now.toISOString().slice(0,10);state.records.unshift({id:`record-${Date.now()}`,date:iso,time:now.toTimeString().slice(0,5),text,settle:settleFor(text,state.mode),tags:['#此刻'],status:'暂时安放'});persist();$('#thoughtInput').value='';$('#responseCard').classList.add('is-hidden');$('#composerHint').textContent='已留下。你可以继续说，也可以先离开。';toast('这声回声已留下')});
      $('#quietResponseButton').addEventListener('click',()=>{$('#responseCard').classList.add('is-hidden');$('#composerHint').textContent='已安静下来。今天不需要继续。'});
      $('#quietButton').addEventListener('click',()=>toast('今天先不提醒，你随时可以回来'));
      $$('.mode').forEach(b=>b.addEventListener('click',()=>{state.mode=b.dataset.mode;$$('.mode').forEach(x=>x.classList.toggle('is-selected',x===b));$('#composerHint').textContent=b.dataset.mode==='recall'?'回看过去需要在设置中允许历史回声。':'默认只回应，不催促。你也可以先记录，不回应。'}));
      $$('.tool').forEach(b=>b.addEventListener('click',()=>{if(b.id==='tagButton'){toast('标签功能已预留，会帮助你找到相似的回声');return}b.classList.toggle('is-selected');toast(`${b.getAttribute('aria-label')}${b.classList.contains('is-selected')?'已选择':'已取消'}`)}));
      $$('.archive-tab').forEach(b=>b.addEventListener('click',()=>{state.archiveMode=b.dataset.archiveMode;renderArchive()}));
      $('#dateFilter').addEventListener('click',()=>{$('#dateFilter').textContent=$('#dateFilter').textContent.includes('30')?'全部时间⌄':'最近 30 天⌄';toast('已切换时间范围')});$('#tagFilter').addEventListener('click',()=>{$('#tagFilter').textContent=$('#tagFilter').textContent.includes('所有')?'此刻⌄':'所有标签⌄';toast('已切换标签范围')});
      $('#settingsButton').addEventListener('click',openSettings);$('#closeSettings').addEventListener('click',closeSettings);$('#doneSettings').addEventListener('click',()=>{closeSettings();toast('设置已保存')});$('#settingsModal').addEventListener('click',e=>{if(e.target.id==='settingsModal')closeSettings()});$$('[data-theme-choice]').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.themeChoice)));$$('[data-hand-choice]').forEach(b=>b.addEventListener('click',()=>setHand(b.dataset.handChoice)));$('#reminderToggle').addEventListener('change',e=>{state.reminders=e.target.checked;persist()});$('#historyToggle').addEventListener('change',e=>{state.history=e.target.checked;persist()});
      $('#floatingMenu').addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(!action||!state.menuRecord)return;const record=state.records.find(r=>r.id===state.menuRecord);if(action==='delete'){state.records=state.records.filter(r=>r.id!==state.menuRecord);persist();renderArchive();toast('这条回声已删除')}else if(action==='edit'&&record){setView('now');$('#thoughtInput').value=record.text;toast('已把回声放回编辑框')}else if(action==='tag'&&record){record.tags=[...(record.tags||[]),'#已回看'];persist();renderArchive();toast('已添加回看标签')}closeMenu()});
      $('.screen').addEventListener('click',e=>{if(!e.target.closest('.more')&&!e.target.closest('.floating-menu'))closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();closeSettings()}});
      document.body.dataset.theme=state.theme;document.body.dataset.hand=state.hand;setTheme(state.theme);setHand(state.hand);$('#reminderToggle').checked=state.reminders;$('#historyToggle').checked=state.history;setInterval(()=>{const d=new Date();$('#liveTime').textContent=d.toTimeString().slice(0,5)},30000);
    })();
  </script>
  <script type="module">
    import { LiquidGlass } from './liquidglass.js';
    const glassRoot = document.querySelector('.hero-inner');
    const composerGlass = document.querySelector('.composer');
    if (glassRoot && composerGlass && 'WebGLRenderingContext' in window) {
      composerGlass.dataset.config = JSON.stringify({
        blurAmount: 0.18,
        refraction: 0.58,
        chromAberration: 0.035,
        edgeHighlight: 0.16,
        specular: 0.22,
        fresnel: 0.72,
        cornerRadius: 22,
        zRadius: 24,
        opacity: 0.92,
        saturation: 0.08,
        tintStrength: 0.08,
        brightness: 0.02,
        shadowOpacity: 0.26,
        shadowSpread: 12,
        shadowOffsetY: 4
      });
      LiquidGlass.init({ root: glassRoot, glassElements: [composerGlass] }).catch(() => {
        composerGlass.classList.add('liquidglass-fallback');
      });
    }
  </script>
</body>
