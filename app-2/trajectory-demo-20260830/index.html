<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#092f6e" />
  <title>轨迹 · 自画像的回声</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;--ink:#fff9f0;--soft:rgba(255,246,235,.72);--faint:rgba(255,246,235,.5);--line:rgba(255,246,235,.2);--accent:#9fd7ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:12px;background:radial-gradient(circle at 15% 10%,#f2d7c6 0,transparent 30%),linear-gradient(135deg,#eee9e5,#8fa7ad 55%,#384f5b);color:var(--ink)}
    button,textarea{font:inherit}button{border:0;color:inherit;cursor:pointer}.phone{width:min(100%,410px);min-height:min(860px,calc(100vh - 24px));padding:7px;border-radius:43px;background:linear-gradient(145deg,#ffffffd0,#b5cbd099 45%,#30414dc2);box-shadow:0 30px 70px #0e1b2466}.screen{position:relative;min-height:100%;overflow:hidden;border-radius:36px;background:#092f6e;isolation:isolate}.backdrop{position:absolute;inset:0;z-index:-2;background:radial-gradient(ellipse at 19% 8%,#3b8ede,#0d4a97 45%,#062c68 100%);animation:water 12s ease-in-out infinite alternate}.backdrop:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#ffffff14,transparent 32%,#00082038)}@keyframes water{to{filter:hue-rotate(9deg) saturate(1.08);transform:scale(1.04)}}
    .content{min-height:min(846px,calc(100vh - 38px));padding:15px 16px 12px;display:flex;flex-direction:column}.status{display:flex;justify-content:space-between;font-size:14px;text-shadow:0 1px 4px #0005}.status-right{font-size:10px;opacity:.85}.topbar{display:flex;align-items:center;justify-content:space-between;margin-top:13px}.menu-button,.quiet{width:40px;height:34px;background:transparent}.menu-button i{display:block;width:17px;height:2px;margin:6px 0;background:#fff;opacity:.85}.quiet{font-size:21px;color:#ffffffb5}.mark{font-size:22px;letter-spacing:.2em}.view{flex:1;display:flex;flex-direction:column}.hero{flex:1;display:flex;align-items:center;justify-content:center;padding:15px 0 28px}.hero-inner{width:94%;max-width:360px}.eyebrow{margin:0 0 10px;color:var(--soft);font-size:11px;letter-spacing:.16em}.headline{margin:0 0 16px;font:400 clamp(27px,8vw,40px)/1.15 Georgia,serif;letter-spacing:-.04em}.subhead{margin:0 0 20px;color:var(--soft);font-size:13px;line-height:1.6}.composer{padding:16px;border:1px solid #ffffff4d;border-radius:22px;background:linear-gradient(135deg,#ffffff33,#ffffff12 45%,#7ecaff26);box-shadow:inset 0 1px #ffffffad,0 16px 34px #03183c30;backdrop-filter:blur(19px)}textarea{display:block;width:100%;min-height:105px;resize:none;outline:0;border:0;background:transparent;color:var(--ink);font-size:16px;line-height:1.6}textarea::placeholder{color:#ffffffbd}.composer-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:11px}.tools{display:flex;gap:6px}.tool{width:30px;height:30px;border-radius:10px;background:#ffffff1f;border:1px solid #ffffff1f;color:#ffffffbf;font-size:12px}.tool:hover,.tool.selected{background:#9fd7ff47;color:#fff}.respond{min-height:34px;padding:0 14px;border-radius:999px;background:#3e8ee4c7;border:1px solid #ffffff59;font-size:12px}.hint{margin:10px 0 0;color:#ffffff8c;font-size:10px;line-height:1.5}.mode-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.mode{padding:7px 10px;border-radius:999px;background:#ffffff14;border:1px solid #ffffff2b;color:#ffffffa8;font-size:10px}.mode.selected{background:#a8deff3d;color:#fff}.response{margin-top:13px;padding:14px;border-radius:17px;background:linear-gradient(135deg,#ffffff33,#ffffff12);border:1px solid #ffffff3d;backdrop-filter:blur(18px)}.response-label{margin-bottom:8px;color:var(--accent);font-size:10px;letter-spacing:.1em}.response p{margin:0 0 12px;font:400 14px/1.65 Georgia,serif}.response-actions{display:flex;align-items:center;gap:13px}.secondary{padding:8px 11px;border-radius:10px;background:#ffffff26;border:1px solid #ffffff3d;font-size:11px}.text-button{padding:4px 0;background:transparent;color:#ffffffb3;font-size:11px}.bottom-nav{display:flex;height:48px;margin-top:auto}.nav-button{width:50%;background:transparent;color:#ffffff80;font:400 17px Georgia,serif}.nav-button.active{color:#fff;border-bottom:1px solid #ffffffb3}.archive-head{padding-top:15px}.archive-head h2{margin:0;font:400 29px Georgia,serif}.archive-list{flex:1;overflow:auto;margin-top:16px}.entry{padding:12px 0;border-bottom:1px solid #ffffff1f}.entry time{color:#ffffff80;font-size:10px}.entry p{margin:7px 0 0;font-size:13px;line-height:1.55}.empty{padding:70px 20px;text-align:center;color:#ffffff8c;font-size:12px;line-height:1.7}.settings{position:absolute;inset:auto 0 0;padding:18px 20px 22px;border-radius:25px 25px 0 0;background:#e4f2fbea;color:#203443;z-index:3}.settings h3{margin:0 0 14px;font:500 26px Georgia,serif}.setting{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #2034431f;font-size:12px}.close{float:right;border-radius:50%;width:30px;height:30px;background:#ffffff99;color:#203443;font-size:19px}.done{width:100%;min-height:38px;margin-top:15px;border-radius:12px;background:#2e716e;color:#fff}.qr-panel{position:fixed;right:18px;bottom:18px;max-width:190px;padding:12px;border-radius:16px;background:#fffffff2;color:#203443;box-shadow:0 12px 30px #0003;display:none}.qr-panel strong{display:block;font-size:12px}.qr-panel p{margin:5px 0 9px;font-size:10px;line-height:1.4}.qr-panel input{width:100%;padding:7px;border:1px solid #20344333;border-radius:8px;font-size:10px}.qr-panel button{margin-top:7px;padding:7px 9px;border-radius:8px;background:#2e716e;color:#fff;font-size:10px}.is-hidden{display:none!important}@media(max-width:520px){body{padding:0}.phone{width:100%;min-height:100vh;border-radius:0;padding:0}.screen{border-radius:0}.content{min-height:100vh}.qr-panel{position:static;margin:10px auto;display:block}}
    .qr-panel{display:block}
  </style>
</head>
<body>
  <main class="phone"><section class="screen"><div class="backdrop"></div><div class="content">
    <div class="status"><span id="clock">12:30</span><span class="status-right">●  Wi‑Fi&nbsp;&nbsp;▣ 70</span></div>
    <div class="topbar"><button class="menu-button" id="settingsBtn" aria-label="打开设置"><i></i><i></i></button><div class="mark">轨迹 ·</div><button class="quiet" id="quietBtn" aria-label="暂时安静">☾</button></div>
    <section class="view" id="nowView"><div class="hero"><div class="hero-inner"><p class="eyebrow">帮助此刻的你回应，让未来的你理解</p><h1 class="headline">此刻，什么在你心里<br/>占着位置？</h1><p class="subhead">不用整理好再说。写下一句话，我们一起把它变成一个能承担的小回应。</p>
      <section class="composer"><textarea id="thought" placeholder="比如：我想换工作，但不知道从哪里开始……"></textarea><div class="composer-toolbar"><div class="tools"><button class="tool selected" data-input="文字">T</button><button class="tool" data-input="语音">◉</button><button class="tool" data-input="图片">▧</button></div><button class="respond" id="respond">听见我</button></div><p class="hint" id="hint">默认只回应，不催促。内容只保存在你的设备上。</p></section>
      <div class="mode-row"><button class="mode selected" data-mode="reflect">只听我说</button><button class="mode" data-mode="break_down">帮我拆一步</button><button class="mode" data-mode="recall">帮我回看过去</button></div>
      <section class="response is-hidden" id="response"><div class="response-label">● 一声回声 <span id="sourceLabel">· 本地兜底</span></div><p id="responseText"></p><div class="response-actions"><button class="secondary" id="save">留下这声回声</button><button class="text-button" id="quietResponse">先安静一会儿</button></div></section>
    </div></div></section>
    <section class="view is-hidden" id="archiveView"><div class="archive-head"><p class="eyebrow">留给未来的自己</p><h2>回声时间线</h2></div><div class="archive-list" id="archiveList"></div></section>
    <nav class="bottom-nav"><button class="nav-button active" data-view="now">此刻</button><button class="nav-button" data-view="archive">留存</button></nav>
  </div><div class="settings is-hidden" id="settings"><button class="close" id="closeSettings">×</button><h3>设置</h3><div class="setting"><span>允许回看过去</span><input type="checkbox" id="history" /></div><div class="setting"><span>主动提醒（默认关闭）</span><input type="checkbox" id="reminders" /></div><button class="done" id="doneSettings">完成</button></div></section></main>
  <aside class="qr-panel" id="qrPanel"><strong>现场扫码入口</strong><p>部署后把公开 HTTPS 地址粘贴到这里生成二维码。</p><input id="urlInput" value="https://your-demo.vercel.app"/><button id="makeQr">生成二维码</button><div id="qrcode"></div></aside>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="app.js"></script>
</body></html>
